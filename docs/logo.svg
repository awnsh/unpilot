<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Unpilot logo">
  <title>Unpilot</title>
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3644"/>
      <stop offset="1" stop-color="#17151c"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f2c38"/>
      <stop offset="1" stop-color="#1d1b23"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="slash" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E8704A"/>
      <stop offset="1" stop-color="#FFB08A"/>
    </linearGradient>
  </defs>

  <!-- keycap base + lip -->
  <rect x="40" y="56" width="432" height="424" rx="108" fill="#0c0b0f"/>
  <rect x="40" y="36" width="432" height="420" rx="108" fill="url(#cap)"/>
  <!-- top face with glassy rim -->
  <rect x="76" y="64" width="360" height="344" rx="84" fill="url(#face)"/>
  <rect x="76.5" y="64.5" width="359" height="343" rx="83.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- the "pilot" glyph being cancelled -->
  <g transform="translate(136 116) scale(10)" fill="none" stroke="#cfcbd6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 4h5a3 3 0 0 1 3 3v3"/>
    <path d="M16 20h-5a3 3 0 0 1-3-3v-3"/>
    <path d="M4 14h4l3-4h9"/>
  </g>

  <!-- the slash -->
  <line x1="128" y1="372" x2="386" y2="112" stroke="#1d1b23" stroke-width="58" stroke-linecap="round"/>
  <line x1="128" y1="372" x2="386" y2="112" stroke="url(#slash)" stroke-width="34" stroke-linecap="round"/>
</svg>
